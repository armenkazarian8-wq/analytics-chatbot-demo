# Optional: PostgreSQL + pgvector for the production-like setup.
# The demo also runs locally with SQLite + in-memory vectors (default).
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: analytics_chat
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d analytics_chat"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
